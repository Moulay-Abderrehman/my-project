services:
  # ── Backend Django ───────────────────────────────────────────────────────────
  - type: web
    name: financeapp-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: financeapp-backend.onrender.com,localhost,127.0.0.1,.onrender.com,.render.com
      - key: DATABASE_URL
        fromDatabase:
          name: financeapp-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://financeapp-frontend.onrender.com,https://tresorery-finance-app.netlify.app
      - key: DISABLE_COLLECTSTATIC
        value: 0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

  # ── Frontend React ───────────────────────────────────────────────────────────
  - type: web
    name: financeapp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Base de données PostgreSQL ───────────────────────────────────────────────
databases:
  - name: financeapp-db
    plan: free
    databaseName: financeapp
    user: financeapp_user
    region: frankfurt
    ipAllowList: []