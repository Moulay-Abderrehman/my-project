services:
  - type: web
    name: financeapp-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        value: django-insecure-8x5k9m2p4q7r1t3v6w0y8z2a4b6c8d0e2f4g6h8
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DISABLE_COLLECTSTATIC
        value: 1

databases:
  - name: financeapp-db
    plan: free
    region: frankfurt
    ipAllowList: []