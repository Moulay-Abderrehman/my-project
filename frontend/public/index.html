<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <!--
      ✅ FAVICON SVG intégré directement — remplace le logo React par défaut.
      Il affiche un "F" stylisé violet (couleur de votre app) sur fond blanc arrondi.
      Pour utiliser votre propre logo :
        1. Mettez votre fichier logo (ex: logo.png) dans le dossier public/
        2. Remplacez les deux lignes <link rel="icon"> et <link rel="apple-touch-icon">
           par : <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='72' font-size='62' font-family='Arial,sans-serif' font-weight='900' text-anchor='middle' fill='white'>F</text></svg>" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='72' font-size='62' font-family='Arial,sans-serif' font-weight='900' text-anchor='middle' fill='white'>F</text></svg>" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />

    <!--
      ✅ Titre de l'application — remplace "React App" par le nom de votre app.
      Changez "FinanceApp" par le vrai nom de votre application si nécessaire.
    -->
    <title>FinanceApp</title>

    <meta name="description" content="FinanceApp — Gérez vos finances personnelles facilement" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <div id="root"></div>
  </body>
</html>
